<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おはなしの森の図書館</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 本棚の画面（図書館） -->
<section id="shelf" class="screen">
  <header class="forest-head">
    <svg class="trees" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 120 L0 80 L40 30 L80 80 L110 50 L150 90 L190 20 L240 90 L280 55 L320 95 L360 35 L410 95 L450 60 L500 100 L540 25 L600 100 L640 50 L690 95 L730 40 L780 100 L820 60 L870 95 L910 30 L960 100 L1000 55 L1050 95 L1090 35 L1140 90 L1200 60 L1200 120 Z"/>
    </svg>
    <h1>おはなしの森の図書館</h1>
    <p class="sub">ミニストーリーの本だな</p>
  </header>

  <nav class="chips" id="chips" aria-label="札でしぼりこむ"></nav>

  <main class="room">
    <div class="bookcase" id="bookcase"></div>
    <p class="empty" id="empty" hidden>この札の本は、まだありません。</p>
  </main>
</section>

<!-- 本文の画面（白地・文字だけ） -->
<section id="reader" class="screen" hidden>
  <div class="page" id="page"></div>

  <div class="toolbar" id="toolbar">
    <div class="tb-row">
      <button class="btn back" id="btnBack" title="本だなにもどる（Esc）">← 本だな</button>
      <span class="info" id="info"></span>
      <button class="btn small" id="btnHide" title="ボタンをかくす（H）">かくす</button>
    </div>
    <div class="tb-row">
      <div class="group" aria-label="見せ方">
        <button class="btn tog" id="btnDir">縦書き</button>
        <button class="btn" id="btnSmaller" title="文字を小さく（−）">A−</button>
        <button class="btn" id="btnFit" title="画面に合わせる（0）">ぴったり</button>
        <button class="btn" id="btnBigger" title="文字を大きく（＋）">A＋</button>
        <button class="btn tog" id="btnWakachi">分かち書き</button>
      </div>
      <div class="group" aria-label="しるし">
        <button class="btn tog mk hito" data-mark="hito">登場人物</button>
        <button class="btn tog mk kaiwa" data-mark="kaiwa">会話文</button>
        <button class="btn tog mk toki" data-mark="toki">時間</button>
        <button class="btn tog mk basho" data-mark="basho">場所</button>
        <button class="btn tog mk oto" data-mark="oto">オノマトペ</button>
        <button class="btn tog mk kokoro" data-mark="kokoro">心情</button>
      </div>
      <div class="group" aria-label="読む行">
        <button class="btn tog" id="btnSlit" title="読む行だけ見せる（S）">読む行だけ</button>
      </div>
      <div class="group" id="grpAudio" aria-label="範読" hidden>
        <button class="btn play" id="btnPlay" title="範読をはじめる・とめる（スペース）">▶ 範読</button>
        <button class="btn" id="btnRewind" title="はじめにもどす">⏮</button>
      </div>
    </div>
  </div>
  <button class="btn show-ui" id="btnShow" hidden title="ボタンを出す（H）">ボタン</button>
</section>

<script src="js/app.js"></script>
</body>
</html>
